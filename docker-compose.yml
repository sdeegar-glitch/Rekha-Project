# Docker Compose for Development
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: psychology_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-psychology}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-psychology_dev_password}
      POSTGRES_DB: ${DB_NAME:-psychology_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-psychology} -d ${DB_NAME:-psychology_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psychology_network

  redis:
    image: redis:7-alpine
    container_name: psychology_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psychology_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psychology_app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-psychology}:${DB_PASSWORD:-psychology_dev_password}@postgres:5432/${DB_NAME:-psychology_db}?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-key-change-in-production-min-32-chars}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - psychology_network
    command: npm run dev

  socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    container_name: psychology_socket
    environment:
      DATABASE_URL: postgresql://${DB_USER:-psychology}:${DB_PASSWORD:-psychology_dev_password}@postgres:5432/${DB_NAME:-psychology_db}?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-key-change-in-production-min-32-chars}
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - psychology_network
    command: npm run dev:socket

  # Prisma Studio for database management
  prisma-studio:
    image: node:20-alpine
    container_name: psychology_prisma_studio
    working_dir: /app
    command: npx prisma studio --hostname 0.0.0.0 --port 5555
    environment:
      DATABASE_URL: postgresql://${DB_USER:-psychology}:${DB_PASSWORD:-psychology_dev_password}@postgres:5432/${DB_NAME:-psychology_db}?schema=public
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - psychology_network

volumes:
  postgres_data:
  redis_data:

networks:
  psychology_network:
    driver: bridge